name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npx vitest run server/src/__tests__/auth.service.test.ts server/src/__tests__/recommendations.matching.test.ts server/src/__tests__/validation.middleware.test.ts
      - name: Integration tests
        run: npm test --workspace server
      - name: Frontend build
        run: npm run build --workspace client
      - name: Backend build
        run: npm run build --workspace server
      - name: Prisma validation
        run: npx prisma validate --schema server/prisma/schema.prisma
      - name: Dependency and security checks
        run: npm audit --audit-level=high

  migrations:
    name: Prisma migrations
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skillswap
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skillswap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/skillswap?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate --schema server/prisma/schema.prisma
      - name: Validate and deploy migrations
        run: npx prisma migrate deploy --schema server/prisma/schema.prisma
