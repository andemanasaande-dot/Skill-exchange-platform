name: Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  preflight:
    name: Production preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Frontend build
        run: npm run build --workspace client
      - name: Backend build
        run: npm run build --workspace server
      - name: Prisma validation
        run: npx prisma validate --schema server/prisma/schema.prisma
      - name: Dependency security check
        run: npm audit --audit-level=high

  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          test -n "$PUBLIC_API_URL"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_PATH"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$REGISTRY_USER"
          test -n "$REGISTRY_TOKEN"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        env:
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
        with:
          context: .
          file: client/Dockerfile
          build-args: VITE_API_URL=${{ env.PUBLIC_API_URL }}/api/v1
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}

  deploy:
    name: Deploy to target host
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Update services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo \"$REGISTRY_TOKEN\" | docker login ghcr.io -u \"$REGISTRY_USER\" --password-stdin && cd \"$DEPLOY_PATH\" && export SKILLSWAP_IMAGE_PREFIX=\"$IMAGE_PREFIX\" SKILLSWAP_IMAGE_TAG=\"$IMAGE_TAG\" && docker compose -f docker-compose.production.yml pull && docker compose -f docker-compose.production.yml up -d --no-build"
