services:
  postgres:
    image: postgres:16-alpine
    container_name: skillswap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillswap
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillswap"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${SKILLSWAP_IMAGE_PREFIX:-skillswap}/backend:${SKILLSWAP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: skillswap-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres@postgres:5432/skillswap?schema=public
      FRONTEND_URL: http://localhost:5173
      EMAIL_PROVIDER: mock
      EMAIL_FROM: noreply@localhost.localdomain
      STORAGE_PROVIDER: local
      LOG_LEVEL: info
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma db push --schema server/prisma/schema.prisma && npx prisma migrate deploy --schema server/prisma/schema.prisma && node server/dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/api/v1/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  frontend:
    image: ${SKILLSWAP_IMAGE_PREFIX:-skillswap}/frontend:${SKILLSWAP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    container_name: skillswap-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  postgres_data:
