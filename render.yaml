services:
  - type: web
    name: skillswap-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: COOKIE_DOMAIN
        sync: false
      - key: EMAIL_PROVIDER
        value: mock
      - key: EMAIL_FROM
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_BUCKET
        value: local
      - key: STORAGE_REGION
        value: local
      - key: STORAGE_ACCESS_KEY
        value: local
      - key: STORAGE_SECRET_KEY
        value: local
      - key: LOG_LEVEL
        value: info